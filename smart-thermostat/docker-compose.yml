services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: thermostat
      POSTGRES_PASSWORD: thermostat
      POSTGRES_DB: thermostat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
